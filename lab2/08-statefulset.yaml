# StatefulSet da mesma app Node.js (imagem S2I lab2-ss neste namespace).
# Nomes previsíveis: lab2-ss-0 (ordinal). Diferente do Deployment, não há hash de ReplicaSet.
#
# O que amarra este arquivo ao 07-service-headless.yaml:
#   spec.serviceName
#     tem de ser o nome do Service headless (lab2-ss-svc). Define o DNS do Pod:
#     lab2-ss-0.lab2-ss-svc.<namespace>.svc.cluster.local
#   template.metadata.labels (app)
#     tem de ser igual a spec.selector.matchLabels deste StatefulSet
#     e igual ao spec.selector do Service headless.
#     Se o label do template divergir do matchLabels, o apply falha.
#     Se divergir do selector do Service, o Service fica sem endpoints.
#
# Pré-requisitos no namespace alvo (-n):
#   - ImageStream/build lab2-ss (S2I) e oc set image-lookup lab2-ss
#   - Service headless 07-service-headless.yaml já aplicado
apiVersion: apps/v1 # StatefulSet pertence ao grupo apps, não ao core v1
kind: StatefulSet # Define o tipo de objeto que será criado
metadata: # metadados do objeto
  name: lab2-ss # vira o prefixo dos Pods: lab2-ss-0, lab2-ss-1, etc.
  labels: # labels do OBJETO StatefulSet em si (o Service não seleciona por aqui)
    app: lab2-ss
    app.kubernetes.io/part-of: node-lab # auxilia na Visão do Desenvolvedor (agrupar / apagar o conjunto)
spec: # campos que definem o comportamento do StatefulSet
  serviceName: lab2-ss-svc # nome do headless em 07-service-headless.yaml; define o DNS do Pod
  replicas: 1 # um Pod ordinal neste lab; subir para 2 criaria lab2-ss-1 com identidade própria
  selector: # seleciona os Pods gerenciados por este StatefulSet
    matchLabels: # tem de ser cópia exata dos labels do template abaixo
      app: lab2-ss # chave/valor arbitrários, desde que iguais no template e no Service
  template:
    metadata: # metadados do template usado para criar os Pods
      labels: # labels que serão aplicados aos Pods (é isto que o Service procura)
        app: lab2-ss
        app.kubernetes.io/part-of: node-lab
    spec: # comportamento dos Pods
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers: # lista de containers do Pod
        - name: node # nome do container dentro do Pod
          # Imagem gerada pelo S2I neste namespace (ImageStream lab2-ss).
          image: lab2-ss:latest
          imagePullPolicy: Always
          ports:
            - name: http # alinha com ports.name do Service headless
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # Enquanto falhar, o Pod fica de fora dos endpoints do Service.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
          livenessProbe:
            # Se falhar, o OCP reinicia o container; o nome ordinal permanece.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 15
