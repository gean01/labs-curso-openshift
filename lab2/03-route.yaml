# Route: expõe lab2-node-svc no router do Sandbox (HTTPS edge).
# Sem spec.host: o cluster preenche <route>-<projeto>.apps.<cluster>.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lab2-node-route
  labels:
    app: lab2-node
    app.kubernetes.io/part-of: node-lab
spec:
  to:
    kind: Service
    name: lab2-node-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
