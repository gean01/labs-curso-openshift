# Deployment: mantém os Pods do app Node.js (imagem S2I lab2-node:latest).
# Quem publica para fora é o Service (02) e a Route (03).
#
# Antes deste apply o aluno cria a imagem via S2I (BuildConfig/ImageStream lab2-node)
# e habilita lookup local: oc set image-lookup lab2-node
#
# Ligações:
# - template.metadata.labels.app (lab2-node) = selector do Service
# - ports[].name http = targetPort do Service e da Route
# - O ReplicaSet criado por este Deployment entra no nome do Pod:
#   lab2-node-<hash-do-rs>-<id-aleatório>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-node
  labels:
    app: lab2-node
    app.kubernetes.io/part-of: node-lab
spec:
  # Duas réplicas: o Service balanceia entre elas; a página mostra os.hostname().
  replicas: 2
  selector:
    matchLabels:
      app: lab2-node
  template:
    metadata:
      labels:
        app: lab2-node
        app.kubernetes.io/part-of: node-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          # Imagem gerada pelo S2I neste projeto (ImageStream lab2-node).
          # Com image-lookup local, "lab2-node:latest" resolve para o registry interno.
          image: lab2-node:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 15
