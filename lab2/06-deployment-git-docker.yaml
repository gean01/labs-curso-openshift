# Este arquivo sobe um app Node cujo código não está escrito aqui.
# Ele vem de https://github.com/gean01/hello-world-nodejs.git,
# branch docker, pasta aplicacao/.
#
# A estratégia é Docker, não Source. O Dockerfile dessa pasta parte de
# registry.access.redhat.com/ubi9/nodejs-20 e instala o curl.
# O arquivo 04 usa a branch main e a estratégia Source, que ignora Dockerfile.
#
# spec.source.contextDir é aplicacao. O clone traz o repositório inteiro,
# mas o build só usa essa pasta. Sem o campo, o OpenShift procura o
# Dockerfile na raiz e não acha: a raiz desta branch não tem Dockerfile
# nem package.json.
#
# Um Deployment não clona Git. A cadeia é:
#   BuildConfig clona o repositório, entra em aplicacao/ e produz uma imagem
#   ImageStream guarda essa imagem no projeto
#   o trigger copia a imagem nova para o Deployment
#   o Service seleciona os Pods desse Deployment
#   a Route publica o Service no Sandbox
#
# O label app=lab-node-git-docker é outro. O Service de 02-service.yaml procura
# app=lab-node, o de 04-deployment-git.yaml procura app=lab-node-git e o de
# 05.2-deployment-git-ssh.yaml procura app=lab-node-git-ssh.
# Nenhum dos três recebe estes Pods.
#
# Ordem dos documentos abaixo: ImageStream, BuildConfig, Deployment, Service, Route.
---
# ImageStream: registro de imagens dentro do projeto do aluno.
# O BuildConfig grava aqui a tag lab-node-git-docker:latest.
# O Deployment não cita o Git; ele cita esta tag.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: lab-node-git-docker
  labels:
    app: lab-node-git-docker
    # Mesmo grupo da Visão do Desenvolvedor dos arquivos 01, 02, 03, 04 e 05.
    app.kubernetes.io/part-of: node-lab
spec:
  lookupPolicy:
    # Permite que um Pod deste projeto use o nome curto lab-node-git-docker:latest.
    # Sem isso, a imagem precisaria do endereço completo do registry interno.
    local: true
---
# BuildConfig: constrói a imagem a partir do Git.
# spec.output.to.name (lab-node-git-docker:latest) é a tag do ImageStream acima.
# O Deployment, mais abaixo, espera essa mesma tag.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: lab-node-git-docker
  labels:
    app: lab-node-git-docker
    app.kubernetes.io/part-of: node-lab
spec:
  source:
    type: Git
    git:
      # Repositório público. A branch docker não tem app na raiz.
      uri: https://github.com/gean01/hello-world-nodejs.git
      # Branch com o Dockerfile. A main continua sendo o app do arquivo 04.
      ref: docker
    # Pasta do clone que entra no build. O Dockerfile e o package.json
    # estão aqui, não na raiz. Sem este campo o build não acha o Dockerfile.
    contextDir: aplicacao
  strategy:
    type: Docker
    dockerStrategy:
      # Caminho do Dockerfile dentro de contextDir. A imagem de base está
      # no FROM desse arquivo (ubi9/nodejs-20). Não há sourceStrategy.from:
      # essa imagem construtora é da estratégia Source, usada no arquivo 04.
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      # Mesmo nome do ImageStream e a tag que o trigger do Deployment observa.
      name: lab-node-git-docker:latest
  triggers:
    # ConfigChange dispara um build assim que este arquivo é aplicado.
    # A branch docker e a pasta aplicacao/ já precisam existir no GitHub.
    - type: ConfigChange
---
# Deployment: sobe o Pod com a imagem que o BuildConfig acabou de produzir.
# metadata.annotations liga este Pod à tag lab-node-git-docker:latest.
# template.metadata.labels.app (lab-node-git-docker) é o valor que o Service abaixo procura.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-node-git-docker
  labels:
    app: lab-node-git-docker
    app.kubernetes.io/part-of: node-lab
  annotations:
    # Quando a tag lab-node-git-docker:latest mudar, o OpenShift grava a imagem nova
    # no campo image do container de nome "node", declarado mais abaixo.
    # O nome entre aspas tem de ser igual a containers[].name.
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"lab-node-git-docker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"node\")].image","pause":"false"}]'
spec:
  # Uma réplica. GET / inclui os.hostname(), o nome do Pod que atendeu.
  replicas: 1
  selector:
    # Tem de ser igual a template.metadata.labels.
    # O Service deste arquivo usa o mesmo app=lab-node-git-docker.
    matchLabels:
      app: lab-node-git-docker
  template:
    metadata:
      labels:
        app: lab-node-git-docker
        app.kubernetes.io/part-of: node-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          # Valor inicial. O trigger acima troca este texto pelo endereço
          # interno da tag lab-node-git-docker:latest quando o build termina.
          image: lab-node-git-docker:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              # index.js faz process.env.PORT || 8080.
              # 8080 é o mesmo número de containerPort e de ports[].port do Service.
              value: "8080"
          ports:
            # name "http" é o elo com o Service e com a Route deste arquivo.
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # GET /health devolve {"status":"ok"}.
            # port: http é ports[].name deste container.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 15
---
# Service: nome estável para os Pods com app=lab-node-git-docker.
# metadata.name (lab-node-git-docker-svc) é o valor de spec.to.name da Route abaixo.
# Não é o lab-node-svc de 02-service.yaml nem o lab-node-git-svc do arquivo 04.
apiVersion: v1
kind: Service
metadata:
  name: lab-node-git-docker-svc
  labels:
    app: lab-node-git-docker
    app.kubernetes.io/part-of: node-lab
spec:
  type: ClusterIP
  selector:
    # Igual a template.metadata.labels.app do Deployment deste arquivo.
    app: lab-node-git-docker
  ports:
    # name "http" é spec.port.targetPort da Route.
    # targetPort "http" é ports[].name do container, que escuta em 8080
    # porque PORT=8080 foi definido no Deployment.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Route: publica lab-node-git-docker-svc no router do Sandbox.
# spec.to.name é metadata.name do Service acima.
# spec.port.targetPort "http" é ports[].name desse Service.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lab-node-git-docker-route
  labels:
    app: lab-node-git-docker
    app.kubernetes.io/part-of: node-lab
spec:
  # Sem spec.host. O router preenche
  # lab-node-git-docker-route-<projeto>.apps.<cluster>.
  to:
    kind: Service
    name: lab-node-git-docker-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
