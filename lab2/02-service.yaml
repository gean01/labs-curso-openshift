# Service ClusterIP dos Pods do Deployment lab2-node.
# A Route (03) cita metadata.name. O selector.app tem de bater com o template do Deployment.
apiVersion: v1
kind: Service
metadata:
  name: lab2-node-svc
  labels:
    app: lab2-node
    app.kubernetes.io/part-of: node-lab
spec:
  type: ClusterIP
  selector:
    app: lab2-node
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
