# ConfigMap: parâmetros NÃO secretos.
# No StatefulSet (04-statefulset.yaml) entram como variáveis de ambiente (leia o trecho
# envFrom.configMapRef.name: lab-pg-configmap). Cada chave vira uma env
# com o mesmo nome. A imagem Red Hat aplica esses valores na configuração
# do servidor. Diferente do Secret: aqui não há senha — só configuração.
apiVersion: v1 # grupo core; ConfigMap é definido em v1
kind: ConfigMap # Define o tipo de objeto que será criado
metadata: # metadados do objeto
  name: lab-pg-configmap # nome citado na propriedade envFrom.configMapRef dos StatefulSets
  labels: # labels do ConfigMap em si.
    app: lab-pg #  label útil para seleção (oc get all -l app=lab-pg) e apagamento (oc delete all -l app=lab-pg).
    app.kubernetes.io/part-of: pg-lab # auxilia na Visão do Desenvolvedor (agrupar / apagar o conjunto numa caixa cinza no consolole web em Workload->topology)
data: # pares chave-valor em texto simples (plain text); não é base64
  POSTGRESQL_MAX_CONNECTIONS: "100" # max_connections do Postgres; teto de conexões simultâneas
  POSTGRESQL_SHARED_BUFFERS: "128MB" # memória compartilhada do cache do banco
  POSTGRESQL_EFFECTIVE_CACHE_SIZE: "256MB" # tamanho do cache;
