# ConfigMap: parâmetros NÃO secretos (tuning do PostgreSQL).
# No StatefulSet (04) entram como variáveis de ambiente via
# envFrom.configMapRef.name: lab-pg-configmap. Cada chave vira uma env
# com o mesmo nome. A imagem Red Hat aplica esses valores na configuração
# do servidor. Diferente do Secret: aqui não há senha — só configuração.
# Comentários com # são ignorados pelo oc apply.
apiVersion: v1 # grupo core; ConfigMap vive em v1
kind: ConfigMap # Define o tipo de objeto que será criado
metadata: # metadados do objeto
  name: lab-pg-configmap # nome citado em envFrom.configMapRef nos StatefulSets
  labels: # labels do OBJETO ConfigMap em si (não selecionam Pods)
    app: lab-pg # identifica o lab; útil em oc get configmap -l app=lab-pg
    app.kubernetes.io/part-of: pg-lab # auxilia na Visão do Desenvolvedor (agrupar / apagar o conjunto)
data: # pares chave-valor em texto simples (plain text); não é base64
  POSTGRESQL_MAX_CONNECTIONS: "100" # max_connections do Postgres; teto de conexões simultâneas
  POSTGRESQL_SHARED_BUFFERS: "128MB" # shared_buffers; memória compartilhada do cache do banco
  POSTGRESQL_EFFECTIVE_CACHE_SIZE: "256MB" # effective_cache_size; pista ao planejador sobre cache disponível
