# Secret: guarda dados sensíveis (senhas, usuários) fora da imagem do container.
# No StatefulSet (04) estes valores entram como variáveis de ambiente (leia o trecho
# envFrom.secretRef.name: lab-pg-secret). Cada chave abaixo vira uma env (no pod)
# com o mesmo nome (POSTGRESQL_USER, POSTGRESQL_PASSWORD, ...).
# A imagem Red Hat do PostgreSQL lê essas variáveis na primeira inicialização
# do Postgres.
apiVersion: v1 # grupo core; Secret é definido em v1, como ConfigMap e Service
kind: Secret # Define o tipo de objeto como Serviço
metadata: # metadados do objeto
  name: lab-pg-secret # nome citado em envFrom.secretRef nos StatefulSets
  labels: # labels do Secret em si (úteis para seleção usando "all" e apagar tudo por label)
    app: lab-pg # identifica o lab; útil em oc get secret -l app=lab-pg
    app.kubernetes.io/part-of: pg-lab # auxilia na Visão do Desenvolvedor (agrupamento numa caixa cinza como vimos na aula 2)
type: Opaque # tipo genérico de Secret (chave-valor arbitrário); Outros tipos seriam: TLS e docker-registry
stringData: # texto claro no YAML; o API server grava em base64 no etcd (para não precisarmos codificar os valores à mão)
  POSTGRESQL_USER: "app_user" # usuário da aplicação; usado por psql -U
  POSTGRESQL_PASSWORD: "app_password_123" # senha do POSTGRESQL_USER
  POSTGRESQL_DATABASE: "app_db" # nome do banco criado na primeira subida do primary
  POSTGRESQL_ADMIN_PASSWORD: "admin_password_123" # senha do usuário administrativo da imagem (postgres)
  POSTGRESQL_MASTER_USER: "repl_user" # usuário de replicação; a réplica usa para o streaming
  POSTGRESQL_MASTER_PASSWORD: "repl_password_123" # senha do repl_user; lida pelo run-postgresql-slave
